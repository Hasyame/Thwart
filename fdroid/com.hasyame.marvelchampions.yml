AntiFeatures:
  NonFreeNet:
    en-US: Card and pack data must be downloaded once from MarvelCDB, a third-party
      service; the app asks before it starts that download, and card pictures come
      from the same service as they are shown. Separately, and only if you set it
      up yourself, the app can sign in to BoardGameGeek with your account credentials
      and post your finished games to your BoardGameGeek play log. Nothing is contacted
      until you ask for it.
    fr-FR: Les données des cartes et des extensions doivent être téléchargées une
      fois depuis MarvelCDB, un service tiers ; l'application demande avant de lancer
      ce téléchargement, et les images des cartes viennent du même service au moment
      où elles s'affichent. Par ailleurs, et uniquement si vous le configurez vous-même,
      l'application peut se connecter à BoardGameGeek avec vos identifiants et y enregistrer
      vos parties terminées. Rien n'est contacté sans votre demande.
