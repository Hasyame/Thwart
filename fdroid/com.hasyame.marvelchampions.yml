    en-US: Card and pack data is downloaded from MarvelCDB, a third-party service. Separately, and only if you set it up yourself, the app can sign in to BoardGameGeek with your account credentials and post your finished games to your BoardGameGeek play log. Both services are optional and neither is contacted until you ask for it.
