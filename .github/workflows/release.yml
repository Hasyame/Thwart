name: Release

# The only workflow that ever sees the signing key.
#
# It is triggered by a tag and nothing else. Tags can only be pushed by someone
# with write access to this repository, so a pull request cannot reach this file
# no matter what it contains. That is the whole security model in one sentence,
# and it is why the checks in ci.yml must never be given secrets: a merged
# malicious pull request would otherwise become code signed by the maintainer
# and installed on other people's phones.
#
#   v1.30.0          a stable release, built from main
#   v1.30.0-beta.1   a beta, built from dev, published as a pre-release
#
# Both take this same path, with the same key and the same protected
# environment. A beta APK is still an APK signed by the maintainer and installed
# on somebody's phone, so it does not get a looser route.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Holds the signing secrets and requires a human to approve the run before
    # they are exposed. Configure it under Settings, Environments, with yourself
    # as a required reviewer and a deployment branch policy covering the tags
    # this workflow accepts.
    environment: release

    permissions:
      # Only to create the release and upload the APK to it.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # Decided before anything is built, so the rest of the job can rely on it.
      - name: Work out whether this is a beta
        id: kind
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is a stable release."
          fi

      # A tag that disagrees with the build is a release nobody can update to.
      - name: Tag matches versionName
        run: bash tools/ci/check-tag-matches-version.sh "${GITHUB_REF_NAME}"

      # The same checks a pull request gets. A tag is not an excuse to skip
      # them: this is the build that reaches people.
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: F-Droid compliance
        run: |
          bash tools/ci/check-no-binaries.sh
          bash tools/ci/check-dependencies.sh

      # Written to a file outside the workspace so it cannot be picked up by a
      # later step that globs the checkout, and removed in an always() step
      # below whatever happens.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured. Refusing to publish a debug-signed release."
            echo "See RELEASING.md for the four secrets this needs."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          cat > "$RUNNER_TEMP/signing/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release
        env:
          MCC_KEYSTORE_PROPERTIES: ${{ runner.temp }}/signing/keystore.properties
        run: ./gradlew --no-daemon assembleRelease

      # Proves the APK is signed by the real key rather than the debug one. The
      # build warns loudly in that case, but a warning in a log nobody reads is
      # how a debug-signed release gets published.
      - name: Verify the signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "This APK is debug-signed. Refusing to publish it."
            exit 1
          fi
          mv "$APK" "Thwart-${GITHUB_REF_NAME#v}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_ARG=()
          # versionCode names the changelog file, and F-Droid reads the same one.
          CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts \
            | grep -oE '[0-9]+' | head -1)
          NOTES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--generate-notes)
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            # Never becomes "Latest", so nobody lands on a beta by accident and
            # F-Droid's own tag pattern ignores it.
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "Thwart-${TAG#v}.apk" \
            --title "Thwart ${TAG#v}" \
            "${NOTES_ARG[@]}" "${FLAGS[@]}"

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" certs.txt
