name: Release

# The only workflow that ever sees the signing key.
#
# It is triggered by a tag and nothing else. Tags can only be pushed by someone
# with write access to this repository, so a pull request cannot reach this file
# no matter what it contains. That is the whole security model in one sentence,
# and it is why the checks in ci.yml must never be given secrets: a merged
# malicious pull request would otherwise become code signed by the maintainer
# and installed on other people's phones.
#
#   v1.30.0          a stable release, built from main and published
#   v1.30.0-beta.1   a beta, built from dev, kept private
#
# Both take this same path, with the same key, the same protected environment
# and the same checks. A beta APK is still an APK signed by the maintainer and
# installed on somebody's phone, so it does not get a looser route.
#
# They differ only at the end. A stable tag creates a public release. A beta tag
# uploads the signed APK as a workflow artifact instead, which only somebody
# with access to this repository can download, because beta access is something
# supporters are given rather than something anybody can take. The maintainer
# collects it and hands it out.
#
# The tag itself is still public, since tags always are. That is deliberate: it
# says a beta exists without giving anybody the binary, and it keeps the version
# history honest.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Holds the signing secrets and requires a human to approve the run before
    # they are exposed. Configure it under Settings, Environments, with yourself
    # as a required reviewer and a deployment branch policy covering the tags
    # this workflow accepts.
    environment: release

    permissions:
      # Only to create the release and upload the APK to it.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # Decided before anything is built, so the rest of the job can rely on it.
      - name: Work out whether this is a beta
        id: kind
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is a stable release."
          fi

      # A tag that disagrees with the build is a release nobody can update to.
      - name: Tag matches versionName
        run: bash tools/ci/check-tag-matches-version.sh "${GITHUB_REF_NAME}"

      # The same checks a pull request gets. A tag is not an excuse to skip
      # them: this is the build that reaches people.
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: F-Droid compliance
        run: |
          bash tools/ci/check-no-binaries.sh
          bash tools/ci/check-dependencies.sh

      # Written to a file outside the workspace so it cannot be picked up by a
      # later step that globs the checkout, and removed in an always() step
      # below whatever happens.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured. Refusing to publish a debug-signed release."
            echo "See RELEASING.md for the four secrets this needs."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          cat > "$RUNNER_TEMP/signing/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The bundled card database. It is gitignored, so a checkout does not
      # have it and assembleRelease will happily build without it: the app
      # installs, opens, and has no cards at all until the player runs a
      # sync. Nobody upgrading would notice, because their database is
      # already on the device, which is exactly why this shipped three times
      # before anyone saw it.
      - name: Fetch the card seed
        run: ./gradlew --no-daemon fetchCardSeed

      - name: Assemble release
        env:
          MCC_KEYSTORE_PROPERTIES: ${{ runner.temp }}/signing/keystore.properties
        run: ./gradlew --no-daemon assembleRelease

      # Belt as well as braces: the fetch above can succeed and still leave
      # nothing useful behind if MarvelCDB changes shape. This is the check
      # that would have caught it, so it guards the artefact rather than the
      # step that produces it.
      - name: The APK carries the cards
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          for LOCALE in en fr; do
            ENTRY="assets/seed/cards_${LOCALE}.json"
            SIZE=$(unzip -l "$APK" "$ENTRY" | awk -v e="$ENTRY" '$4 == e {print $1}')
            if [ -z "$SIZE" ]; then
              echo "$ENTRY is missing. This build would install with no cards."
              exit 1
            fi
            # A seed that parses but holds nothing is the same failure with a
            # file in the way. The real ones are several megabytes.
            if [ "$SIZE" -lt 1000000 ]; then
              echo "$ENTRY is only $SIZE bytes. That is not the card database."
              exit 1
            fi
            echo "$ENTRY: $SIZE bytes."
          done

      # Proves the APK is signed by the real key rather than the debug one. The
      # build warns loudly in that case, but a warning in a log nobody reads is
      # how a debug-signed release gets published.
      - name: Verify the signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "This APK is debug-signed. Refusing to publish it."
            exit 1
          fi
          mv "$APK" "Thwart-${GITHUB_REF_NAME#v}.apk"

      # Betas stop here. The APK is signed and verified, and it goes nowhere
      # public: it is attached to this workflow run, and only somebody with
      # access to this repository can download it.
      - name: Keep the beta private
        if: steps.kind.outputs.prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Thwart-${{ github.ref_name }}
          path: Thwart-*.apk
          if-no-files-found: error
          # Long enough to hand out and to go back to if a tester reports
          # something a fortnight later, short enough not to accumulate.
          retention-days: 60

      - name: Publish the release
        if: steps.kind.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_ARG=()
          # versionCode names the changelog file, and F-Droid reads the same one.
          CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts \
            | grep -oE '[0-9]+' | head -1)
          NOTES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--generate-notes)
          fi
          ASSET="Thwart-${TAG#v}.apk"
          # A re-run, or a release already published by hand. Neither is a
          # reason to fail the run, and neither is a reason to overwrite a
          # binary people may already have downloaded.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$ASSET"; then
              echo "It already carries $ASSET. Nothing to do."
            else
              echo "Attaching $ASSET to it."
              gh release upload "$TAG" "$ASSET"
            fi
            exit 0
          fi
          gh release create "$TAG" "$ASSET" \
            --title "Thwart ${TAG#v}" \
            "${NOTES_ARG[@]}"

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" certs.txt
