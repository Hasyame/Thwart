name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway: a half-published site is
# worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy the web companion
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # The card text is not in the repository, for the same reason the app's
      # seed is not. It is fetched here, which also means every deploy publishes
      # whatever MarvelCDB has today rather than whatever it had when somebody
      # last remembered to run the script.
      - name: Fetch the card data
        run: python tools/build_web_data.py

      - name: Check it parses and is not empty
        run: |
          python -c "
          import json, os
          for name in ('cards.en.json', 'cards.fr.json', 'rules.json'):
              path = os.path.join('web/data', name)
              with open(path, encoding='utf-8') as handle:
                  data = json.load(handle)
              count = len(data if isinstance(data, list) else data['entries'])
              print('%s: %d entries, %.2f MB' % (name, count, os.path.getsize(path) / 1048576.0))
              assert count > 100, name + ' looks empty'
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
