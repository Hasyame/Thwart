name: An idea
description: Something the app could do, or do better
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, including half-formed ones. If you are thinking of
        building it yourself, please open this first so we can agree on it before
        you spend an evening on it.

  - type: textarea
    id: problem
    attributes:
      label: What is awkward at the moment
      description: |
        The situation at your table, rather than the solution. "I keep losing
        track of X" tells me more than "add a button for X", and often there is
        a simpler answer than the one either of us thought of first.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: If you already have a solution in mind, describe it here.
    validations:
      required: false

  - type: dropdown
    id: offer
    attributes:
      label: Would you like to build it
      options:
        - "No, just suggesting"
        - "Maybe, with some guidance"
        - "Yes"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        A few things I will decline, so you are not disappointed later: anything
        that copies rules or card text into the app, anything needing an account
        or a server, and anything pulling in Google Play Services, Firebase,
        advertising or analytics. The app collects nothing and works offline, and
        that is deliberate.
